name: Theme Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP syntax check
        run: |
          set -e
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: JSON validation
        run: |
          set -e
          find . -type f -name '*.json' -not -path './vendor/*' -print0 | while IFS= read -r -d '' file; do
            php -r 'json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR);' "$file"
          done

      - name: JavaScript syntax check
        run: |
          set -e
          if command -v node >/dev/null 2>&1; then
            find . -type f -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -r -n1 node --check
          fi
